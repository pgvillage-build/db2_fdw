name: Minimal workflow for CI/CD
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The required checks also run in the merge queue: the tested commit is what lands on main
  merge_group:

env:
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  builder_images:
    strategy:
      matrix:
        pgversion:
          - 14
          - 15
          - 16
          - 17
          # PGVERSION 18 does not work with the current release yet
          #- 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: show the docker compose version
        run: |
          docker compose version

      - name: create rpms folder as required
        run: |
          mkdir -p rpms
          chmod 777 rpms

      - name: build rpm's
        run: |
          docker compose up builder --exit-code-from builder
        env:
          PGVERSION: ${{ matrix.pgversion }}

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - builder_images
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: ${RESULTS}"
          if [ "$(echo "${RESULTS}" | jq -r 'all(. == "success")')" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
